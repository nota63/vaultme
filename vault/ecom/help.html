<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Request</title>
    <!-- Google Fonts: Using 'Inter' for a modern, clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0F2F5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 400px;
            height: 400px;
            overflow-y: auto;
            text-align: center;
            animation: fadeInUp 0.7s ease-out;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Premium scrollbar styling */
        .container::-webkit-scrollbar {
            width: 8px;
        }

        .container::-webkit-scrollbar-track {
            background: #F0F2F5;
            border-radius: 10px;
        }

        .container::-webkit-scrollbar-thumb {
            background-color: #007BFF;
            border-radius: 10px;
            border: 2px solid #F0F2F5;
        }

        .help-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, textarea, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 10px;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #007BFF;
            outline: none;
        }

        button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0Ij4KICA8cGF0aCBkPSJNMTIgMjJDNi40OSAyMiAyIDcuNTEgMiA2cy40OS00IDEyLTQgMTIgMCAxMiAxMCAxMmExMiAxMiAwIDAgMS0xMiAxMiIgZmlsbD0iI0E5QURCQyIvPgogIDxwYXRoIGQ9Ik0xMiA0Yy0yLjIxIDAtNCAxLjc5LTQgNHYxLjVhMS41IDEuNSAwIDAgMCAzIDBWOGMwLTEuMTExLjktMiAyLTJzMiAuODg5IDIgMlY5LjVhMS41IDEuNSAwIDAgMCAzIDBWOGMwLTIuMjEtMS43OS00LTQtNHptMCAxNGEyIDEuNSAxLjUgMCAxIDAgMCAwIDEgMS41IDEuNSAwIDAgMCAwIDB6IiBmaWxsPSIjRkZGIi8+Cjwvc3ZnPg==" alt="Help Icon" class="help-icon">
    <h2>Help Request for Order {{ help.item}}</h2>
    <p>Please ensure your messages are formal. Our team will reach you shortly via your email or contact.</p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit Request</button>
    </form>
</div>

</body>
</html>
