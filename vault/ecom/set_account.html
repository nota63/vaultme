<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Seller Account | VaultMe</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a1a1a;
            color: #eaeaea;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 5px;
            color: #d4af37;
            text-align: center;
            animation: fadeInDown 1s ease-out;
        }

        h2 {
            font-size: 1.2em;
            font-weight: 500;
            margin-bottom: 5px;
            color: #f8f8f8;
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        h3 {
            font-size: 0.9em;
            font-weight: 400;
            margin-bottom: 10px;
            color: #b0b0b0;
            text-align: center;
            animation: fadeInUp 1.2s ease-out;
        }

        p {
            font-size: 0.8em;
            text-align: center;
            margin-bottom: 15px;
            color: #eaeaea;
            animation: fadeInUp 1.4s ease-out;
        }

        section {
            width: 100%;
            max-width: 400px;
            background-color: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            padding: 10px 15px;
            animation: slideIn 1s ease-out;
        }

        form {
            display: flex;
            flex-direction: column;
            height: 400px;
            width: 100%;
            max-width: 400px;
            overflow-y: auto;
            animation: fadeInUp 1.6s ease-out;
            padding-right: 10px; /* Space for scrollbar */
        }

        form input, form button {
            font-size: 0.8em;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            outline: none;
            transition: all 0.3s ease;
        }

        form input {
            background-color: #333;
            color: #eaeaea;
        }

        form input:focus {
            border-color: #d4af37;
        }

        form button {
            background-color: #d4af37;
            color: #1a1a1a;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        form button:hover {
            background-color: #b38f00;
            transform: translateY(-2px);
        }

        /* Custom scrollbar styling */
        form::-webkit-scrollbar {
            width: 8px;
        }

        form::-webkit-scrollbar-track {
            background: #333;
            border-radius: 10px;
        }

        form::-webkit-scrollbar-thumb {
            background-color: #d4af37;
            border-radius: 10px;
            border: 2px solid #333;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-100%); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <h1>VaultMe Seller Account</h1>

    <section>
        <h2>Set Up Your Seller Account</h2>
        <h3>Please enter the details carefully!</h3>
        <p>Don't create a seller account if you already have one. Update it instead.</p>
    </section>

    <section>
        {% if messages %}
            {% for m in messages %}
                <p>{{ m }}</p>
            {% endfor %}
        {% endif %}
    </section>

    <section>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>
    </section>

</body>
</html>
