<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Your Order</title>
    <style>
        /* General Resets */
        body, h1, h2, h3, h4, h5, h6, p, ul, li, form, input, button {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f1f1;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 20px;
            color: #212121;
            text-align: center;
        }

        section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form label {
            font-size: 0.9rem;
            font-weight: 400;
            margin-bottom: 5px;
            color: #555;
        }

        form input, form select {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        button[type="submit"] {
            background-color: #2874f0;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Enter Your Address to Place Your Order  {{ address.item.title }}</h1>

    <section>
        <p>Note: as of now we are providing only cash on delivery (COD) service but later we will provide UPI service also</p>
    </section>

    <section>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Place Order</button>
        </form>
    </section>

</body>
</html>
