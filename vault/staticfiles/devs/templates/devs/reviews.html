<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reviews</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h4, h6 {
            font-family: 'Patrick Hand', cursive;
            color: green;
            font-weight: bold;
            margin: 10px 0;
            text-align: center;
        }
        div.messages {
            text-align: center;
            margin-bottom: 20px;
        }
        div.messages p {
            color: #ff3333;
            font-weight: 500;
        }
        section {
            background: #fff;
            padding: 20px;
            border-radius: 2px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            opacity: 0;
            transform: translateY(50px);
        }
        .form-container {
            width: 400px;
            height: 400px;
            overflow: auto;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }
        form p {
            margin-bottom: 10px;
            font-size: 14px;
        }
        form input, form textarea, form select {
            padding: 5px 8px;
            font-size: 9px;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            background: #fafafa;
        }
        form input:focus, form textarea:focus, form select:focus {
            border-color: #007BFF;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            background: #fff;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 8px;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        a {
            text-decoration: none;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        a button {
            background: #007BFF;
            padding: 8px;
            font-size: 12px;
        }
        a button:hover {
            background: #0056b3;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            gsap.to("section", { duration: 1, opacity: 1, y: 0, ease: "power4.out" });
        });
    </script>
</head>
<body>
    <section>
        <h4>Give Your Valuable Review to Us</h4>
        <h6>Once your review  submitted, you couldn't edit or delete your review!</h6>

        <div class="messages">
            {% if messages %}
                {% for n in messages %}
                    <p>{{ n }}</p>
                {% endfor %}
            {% endif %}
        </div>

        <div class="form-container">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Done</button>
            </form>
        </div>

        <a href="{% url 'view_reviews' %}">
            <button type="button">All Reviews</button>
        </a>
    </section>
</body>
</html>
