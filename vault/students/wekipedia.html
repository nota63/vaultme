<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Search Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5em;
            color: #4a90e2;
            font-weight: 700;
        }

        section {
            margin-bottom: 20px;
        }

        section form {
            display: flex;
            gap: 10px;
        }

        section form input, section form button {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9em;
        }

        section form button {
            background: #4a90e2;
            color: #fff;
            cursor: pointer;
            border: none;
            transition: background 0.3s ease;
        }

        section form button:hover {
            background: #357ab8;
        }

        .results {
            text-align: center;
        }

        .results h2 {
            color: #4a90e2;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .results p {
            font-size: 0.9em;
            color: #333;
        }

        .results a {
            color: #4a90e2;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .results a:hover {
            color: #357ab8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Wikipedia Search</h1>
    </header>

    <section>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="query" placeholder="e.g., python programming language" required>
            <button type="submit">Search</button>
        </form>
    </section>

    <div class="results">
        <h1>Wikipedia Search Results for "{{ query }}"</h1>
        {% if result %}
            <h2>{{ result.title }}</h2>
            <p>{{ result.summary }}...</p>
            <p><a href="{{ result.full_url }}" target="_blank">Read more on Wikipedia</a></p>
        {% else %}
            <p>No results found.</p>
        {% endif %}
    </div>
</div>

<script>
    gsap.from("header h1", { duration: 1, y: -50, opacity: 0, ease: "bounce" });
    gsap.from("form input", { duration: 1, x: -100, opacity: 0, delay: 0.5, ease: "power2.inOut" });
    gsap.from("form button", { duration: 1, x: 100, opacity: 0, delay: 0.5, ease: "power2.inOut" });
    gsap.from(".results h1", { duration: 1, y: 50, opacity: 0, ease: "power2.inOut" });
    gsap.from(".results h2", { duration: 1, x: -50, opacity: 0, delay: 0.7, ease: "power2.inOut" });
    gsap.from(".results p", { duration: 1, y: 30, opacity: 0, delay: 0.9, ease: "power2.inOut" });
    gsap.from(".results a", { duration: 1, y: 30, opacity: 0, delay: 1.1, ease: "power2.inOut" });
</script>

</body>
</html>
