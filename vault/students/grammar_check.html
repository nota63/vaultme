<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Check</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            text-align: center;
            padding: 20px;
            background: #f9f9f9;
            color: #333;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        h1 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-family: 'Patrick Hand', cursive;
            color: #009688;
            opacity: 0;
        }
        textarea {
            width: calc(100% - 22px);
            height: 120px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            margin-bottom: 15px;
            resize: vertical;
            opacity: 0;
        }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background-color: #007BFF;
            color: white;
            font-size: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
            opacity: 0;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 15px;
            opacity: 0;
        }
        .result h2 {
            margin-bottom: 10px;
            font-family: 'Montserrat', sans-serif;
        }
        .result p {
            margin: 5px 0;
            font-family: 'Montserrat', sans-serif;
        }
        .spinner {
    border: 4px solid #e0e0e0; /* Light gray background */
    border-top: 4px solid #4caf50; /* Green color for the spinner */
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
}
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .alert {
            color: #e53935;
            font-weight: bold;
            margin-top: 15px;
            font-family: 'Montserrat', sans-serif;
            opacity: 0;
            font-size:10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grammar Check</h1>
        <form method="post" onsubmit="showLoading()">
            {% csrf_token %}
            <textarea name="text" placeholder="Enter text here...">{{ original_text }}</textarea><br>
            <button type="submit">Check Spelling</button>
        </form>
        <div class="spinner"></div>
        {% if corrected_text %}
        <div class="result">
            <h2>Corrected Text:</h2>
            <p>{{ corrected_text }}</p>
        </div>
        {% endif %}
        <div class="alert">
            This tool is under development. Check answers before proceeding.
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script>
        function showLoading() {
            document.querySelector('.spinner').style.opacity = 1;
        }

        document.addEventListener('DOMContentLoaded', () => {
            gsap.to('h1', { opacity: 1, duration: 1, delay: 0.5 });
            gsap.to('textarea', { opacity: 1, duration: 1, delay: 0.7 });
            gsap.to('button', { opacity: 1, duration: 1, delay: 0.9 });
            gsap.to('.result', { opacity: 1, duration: 1, delay: 1.1 });
            gsap.to('.alert', { opacity: 1, duration: 1, delay: 1.3 });
        });
    </script>
</body>
</html>
