<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Note Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5em;
            color: #4a90e2;
            font-weight: 700;
        }

        h2, h3 {
            color: #333;
            font-weight: 600;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #4a90e2;
            margin-right: 10px;
        }

        a button {
            padding: 8px 10px;
            border: none;
            border-radius: 4px;
            background: #4a90e2;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        a button:hover {
            background: #357ab8;
        }

        a.back {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 10px;
            background: #ddd;
            color: #333;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        a.back:hover {
            background: #bbb;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Note Detail</h1>
    </header>

    <h2>Subject: {{ note.subject }}</h2>
    <h3>Chapter: {{ note.chapter }}</h3>
    <p>{{ note.notes }}</p>
    <p>Date Created: {{ note.date_created }}</p>

    <a href="{% url 'delete_notes' note.id %}">
        <button type="submit">Delete this note</button>
    </a>

    <a href="{% url 'edit_note' note.pk %}">
        <button type="submit">Edit this note</button>
    </a>

    <a class="back" href="{% url 'view_notes' %}">Back to notes list</a>
</div>

<script>
    gsap.from("header h1", { duration: 1, y: -50, opacity: 0, ease: "bounce" });
    gsap.from("h2, h3, p, a button, a.back", { duration: 1, y: 50, opacity: 0, delay: 0.5, stagger: 0.2, ease: "power2.inOut" });
</script>

</body>
</html>
