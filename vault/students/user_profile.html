<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ student.user.username }}'s Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .profile-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
        }
        .profile-header {
            display: flex;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 30px;
        }
        .profile-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ddd;
            margin-right: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .profile-info h2 {
            font-family: 'Raleway', sans-serif;
            font-size: 2em;
            margin: 10px 0;
            font-weight: 600;
            color: #333;
        }
        .profile-info p {
            font-size: 1.1em;
            margin: 5px 0;
            color: #555;
        }
        .profile-info .bio {
            margin: 15px 0;
            font-style: italic;
            color: #777;
        }
        .profile-info .joined-date {
            color: #999;
            font-size: 0.9em;
        }
        .profile-posts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            width: 100%;
            opacity: 0;
        }
        .post {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .post img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .post:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .post .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
        }
        .post:hover .overlay {
            opacity: 1;
        }
        .view-profile-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 1.1em;
            font-weight: 500;
            color: #fff;
            background-color: #ff5722;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .view-profile-button:hover {
            background-color: #e64a19;
        }
    </style>
</head>
<body>

{% load static %}
<div class="profile-container">
    <div class="profile-header">
        {% if student.profile_image %}
            <img src="{{ student.profile_image.url }}" alt="Profile Image" class="profile-image">
        {% else %}
            <img src="{% static 'images/default_profile.png' %}" alt="Default Profile Image" class="profile-image">
        {% endif %}
        <div class="profile-info">
            <h2>{{ student.user.username }}</h2>
            <p class="bio">{{ student.bio }}</p>
            <p>Location: {{ student.location }}</p>
            <p>Birth Date: {{ student.birth_date }}</p>
            <p class="joined-date">Joined VaultMe: {{ student.joined_VaultMe }}</p>
        </div>
    </div>

    <div class="profile-posts">
        {% for post in posts %}
            <div class="post">
                <img src="{{ post.pic.url }}" alt="Post Image">
                <div class="overlay">
                    <i class="fas fa-heart"></i>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        gsap.to('.profile-container', { opacity: 1, duration: 1, ease: 'power2.inOut' });
        gsap.to('.profile-posts', { opacity: 1, duration: 1.5, delay: 0.5, ease: 'power2.inOut' });
        gsap.from('.post', { opacity: 0, duration: 0.5, y: 50, stagger: 0.2, delay: 1 });
    });
</script>

</body>
</html>
