<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Posts</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-weight: 700;
            font-size: 2em;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            font-weight: 300;
            margin-bottom: 20px;
            color: #7f8c8d;
        }
        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .top-actions a {
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
        }
        .top-actions a:hover {
            background-color: #0056b3;
        }
        .top-actions svg {
            margin-right: 5px;
        }
        section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .post {
            position: relative;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .post:hover {
            transform: scale(1.03);
        }
        .post img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .post-info {
            padding: 10px;
        }
        .post-info p {
            margin: 3px 0;
        }
        .post-info .date {
            font-weight: 700;
            font-size: 0.8em;
            color: #999;
        }
        .delete-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 0, 0, 0.7);
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
        }
        .delete-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        .search-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .search-bar input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .search-bar input:hover {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }
        .search-bar button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 14px;
        }
        .search-bar button:hover {
            background-color: #0056b3;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
</head>
<body>

<h1>Hey there, {{ request.user.username }}! You can manage your posts here</h1>
<p>Provided by VaultMe</p>

<div class="top-actions">
    <a href="{% url 'download_all_images' %}" class="download-all" title="Download All Images">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
            <path d="M5 20h14v2H5v-2zm7-18l-7 7h4v6h6v-6h4l-7-7z"/>
        </svg>
        Download All
    </a>
</div>

<form method="get" class="search-bar">
    <input type="text" name="search" value="" placeholder="Search by date">
    <button type="submit">Search</button>
</form>

<section>
    {% for post in data %}
    <div class="post">
        <a href="{% url 'delete_posts' post.pk %}" class="delete-icon" title="Delete Post">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M3 6l3 18h12l3-18H3zm3.5 15h11l-1.5-15h-8l-1.5 15zM10 2v2H8V2h2zm6 0v2h-2V2h2z"/>
            </svg>
        </a>
        <img src="{{ post.pic.url }}" alt="Post Image">
        <div class="post-info">
            <p>Posted on: <span class="date">{{ post.date }}</span></p>
        </div>
    </div>
    {% empty %}
    No posts found on this date!
    {% endfor %}
</section>

<script>
    gsap.from("section .post", { duration: 1.5, opacity: 0, y: 50, stagger: 0.3, ease: "power4.out" });
</script>

</body>
</html>
