<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Your Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.5em;
            color: #4a90e2;
            font-weight: 700;
        }

        section {
            margin-bottom: 20px;
        }

        section form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        section form input, section form textarea, section form button {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9em;
        }

        section form button {
            background: #4a90e2;
            color: #fff;
            cursor: pointer;
            border: none;
            transition: background 0.3s ease;
        }

        section form button:hover {
            background: #357ab8;
        }

        .message {
            padding: 10px;
            margin: 10px 0;
            background: #dff0d8;
            border: 1px solid #d0e9c6;
            border-radius: 4px;
        }

        .view-notes {
            text-align: center;
            margin-top: 20px;
        }

        .view-notes button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #4a90e2;
            color: #fff;
            font-size: 0.9em;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .view-notes button:hover {
            background: #357ab8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Welcome dear student, create and access your notes here</h1>
    </header>

    <section>
        {% if messages %}
            {% for m in messages %}
                <div class="message">{{ m }}</div>
            {% endfor %}
        {% endif %}
    </section>

    <section>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Take It</button>
        </form>
    </section>

    <div class="view-notes">
        <a href="{% url 'view_notes' %}">
            <button type="submit">View Notes</button>
        </a>
    </div>
</div>

<script>
    gsap.from("header h1", { duration: 1, y: -50, opacity: 0, ease: "bounce" });
    gsap.from("form input, form textarea, form button", { duration: 1, y: 50, opacity: 0, delay: 0.5, stagger: 0.2, ease: "power2.inOut" });
    gsap.from(".view-notes button", { duration: 1, scale: 0.8, opacity: 0, delay: 1, ease: "back.out(1.7)" });
    gsap.from(".message", { duration: 1, x: 50, opacity: 0, delay: 0.3, stagger: 0.2, ease: "power2.inOut" });
</script>

</body>
</html>
