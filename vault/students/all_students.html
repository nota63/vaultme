<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Students</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #2c3e50, #4ca1af);
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-weight: 700;
            font-size: 2em;
            margin-bottom: 10px;
            text-align: center;
            color: #2ecc71;
        }
        p {
            font-weight: 300;
            margin-bottom: 20px;
            text-align: center;
            color: #bdc3c7;
        }
        .intro {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding: 10px 20px;
        }
        .profiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .profile-card {
            text-align: center;
            position: relative;
            padding: 10px;
            transition: transform 0.3s ease;
        }
        .profile-card:hover {
            transform: scale(1.05);
        }
        .profile-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 2px solid #2ecc71;
        }
        .profile-info h2 {
            font-size: 1em;
            margin: 5px 0;
            font-weight: 700;
        }
        .profile-info a {
            background-color: #0095f6;
            border: none;
            color: white;
            padding: 5px 10px;
            font-size: 0.8em;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
            display: inline-block;
            text-decoration: none;
        }
        .profile-info a:hover {
            background-color: #007bb5;
        }
        .icon {
            margin-right: 5px;
        }
    </style>
</head>
<body>

<section class="intro">
    <h1>Active students on VaultMe students portal</h1>
    <p>Total Active Students: {{ students|length }}</p>
</section>

<section class="profiles">
    {% for s in students %}
    <div class="profile-card">
        <img src="{{ s.profile_image.url }}" alt="Profile Image" class="profile-image">
        <div class="profile-info">
            <h2>{{ s.user }}</h2>
            <a href="{% url 'user_profile' s.user.id %}" class="view-profile-button">
                <i class="fas fa-user icon"></i> View Profile
            </a>
        </div>
    </div>
    {% endfor %}
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
<script>
    gsap.from(".profile-card", { duration: 1, opacity: 0, y: 50, stagger: 0.2 });
</script>

</body>
</html>
